# Adafruit Feather nRF52832 (3406) -- board-specific configuration.
# SPDX-License-Identifier: GPL-2.0-only

# No MCUboot on this board: the stock Adafruit bootloader is kept, so there are
# no image slots for mcumgr to write into. Updates go over UF2, serial DFU, or
# Adafruit's own BLE OTA instead of SMP. See dts/feather-stock-bootloader.dtsi.
CONFIG_MCUMGR=n
CONFIG_MCUMGR_TRANSPORT_BT=n
CONFIG_MCUMGR_GRP_OS=n
CONFIG_MCUMGR_GRP_IMG=n
CONFIG_IMG_MANAGER=n
CONFIG_MCUBOOT_IMG_MANAGER=n
CONFIG_BOOTLOADER_MCUBOOT=n

# Link at the app partition the stock bootloader jumps to.
CONFIG_USE_DT_CODE_PARTITION=y

# NOT UF2. The nRF52832 has no USB peripheral -- nrf52840.dtsi has usbd@40027000,
# nrf52832.dtsi has nothing -- so this board reaches USB through a CP2104 serial
# bridge and cannot present a mass-storage device. Adafruit's UF2 bootloaders are
# nRF52840-only, and Zephyr has no UF2 family ID for the 52832 (the build fails
# with "argument -f/--family: expected one argument" if you ask for one).
#
# The stock bootloader's update paths here are serial DFU over that USB-serial
# bridge, and Adafruit BLE OTA. Both still mean no probe is needed, and both
# survive a bad application image -- which is the property we wanted.

# The FeatherWing is an RFM69HCW: PA0 is not bonded, so PA1+PA2 must be selected
# or nothing radiates. Getting this wrong is silent -- it cost a day on the XIAO.
CONFIG_ORANGELINK_RFM69_HW=y

# Feather divider is 100k/100k -> VBAT/2. UNCALIBRATED: measure the cell and
# correct FULL_OHMS against the millivolts the battery module logs at startup.
CONFIG_ORANGELINK_BATTERY_OUTPUT_OHMS=100000
CONFIG_ORANGELINK_BATTERY_FULL_OHMS=200000

# No charge-current select pin on this board; the charger is fixed in hardware.
CONFIG_ORANGELINK_BATTERY_FAST_CHARGE=n
