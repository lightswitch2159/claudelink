# Orangelink -- NCS application configuration for XIAO nRF52840.
# SPDX-License-Identifier: GPL-2.0-only
#
# Values derived from the measured legacy behaviour in docs/gatt-service-spec.md.

# ---------------------------------------------------------------------------
# Bluetooth: peripheral, no pairing
# ---------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=0

# The legacy firmware requires no pairing, bonding or encryption -- every IPS and
# NUS characteristic was SEC_OPEN. Preserved for companion-app compatibility.
# This is also what makes unvalidated input remotely reachable, so every write
# callback bounds-checks len AND offset. See docs/aps-protocol-spec.md section 7.
CONFIG_BT_SMP=n

# Default name; the persisted Custom Name overrides it at runtime, so the name
# must be dynamic. 30 = legacy BLE_IPS_MAX_CUS_NAME_CHAR_LEN.
CONFIG_BT_DEVICE_NAME="ClaudeLink"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=30

# MTU 247 -- matches legacy NRF_SDH_BLE_GATT_MAX_MTU_SIZE, giving a 244 B ATT
# payload. The Data characteristic is separately capped at 150 by
# BLE_RESPONSE_MAX_LEN and is clamped in code, not by the stack.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# Long (prepare/execute) writes. The legacy firmware ran nrf_ble_qwr for exactly
# this; Zephyr's equivalent is off by default, and with PREPARE_COUNT=0 the server
# answers ATT_PREPARE_WRITE_REQ (0x16) with "not supported".
#
# Found against AndroidAPS: short register writes succeeded, then the first real
# pump command -- a 4b6b payload longer than a 20-byte simple write -- was rejected
# at the ATT layer and never reached the APS handler. The firmware looked healthy
# and the pump looked unreachable.
#
# 12 buffers covers a 150-byte Data write chunked at the default 23-byte MTU.
CONFIG_BT_ATT_PREPARE_COUNT=12

# bt_gatt_exchange_mtu() is a GATT client API, so the peripheral needs the client
# role to initiate MTU negotiation. The legacy firmware got the same behaviour
# from nrf_ble_gatt, which exchanged MTU automatically on connect. Without it we
# depend on the central asking, and AndroidAPS did not -- leaving the link at the
# 23-byte default and forcing long writes for every real pump command.
CONFIG_BT_GATT_CLIENT=y

# Connection parameters: 50-100 ms, latency 0, 5 s supervision timeout.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=40
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=80
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=500

# +4 dBm. On nRF52 the controller TX power is a build-time choice, unlike the
# legacy per-connection sd_ble_gap_tx_power_set().
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# 2M PHY: support it, do NOT request it. Legacy only responded to peer-initiated
# PHY updates, with PHY_AUTO. See docs/gatt-service-spec.md section 7.
# BT_USER_PHY_UPDATE only exposes the le_phy_updated callback for observability;
# Zephyr responds to peer PHY requests with or without it.
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_PHY_UPDATE=y

# Needed for the RSSI the legacy code attached to every DATA_RX event.
CONFIG_BT_CTLR_CONN_RSSI=y

# Standard Battery Service, replacing ble_bas.
CONFIG_BT_BAS=y

# ---------------------------------------------------------------------------
# Peripherals
# ---------------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_WATCHDOG=y

# ---------------------------------------------------------------------------
# Storage: FDS -> Settings/NVS
# ---------------------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
# The legacy application performs NO dynamic allocation: userKit/heap is dead
# code (zero references in app.map) and the C library heap was discarded. Keep
# it that way. See docs/legacy-flash-budget.md.
CONFIG_HEAP_MEM_POOL_SIZE=0

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ---------------------------------------------------------------------------
# Logging -- RTT only
# ---------------------------------------------------------------------------
# RTT rides the SWD link that is already connected, so it needs no extra leads to
# the XIAO's tiny pads -- read it with `pyocd rtt`. Costs ~2 KB.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=2048

# Hold the log thread at startup so a debugger has time to attach before the boot
# burst is flushed. This was previously inherited implicitly: the board's
# Kconfig.cdc_acm_serial.defconfig sets it to 4000 inside "if LOG", and disabling
# BOARD_SERIAL_BACKEND_CDC_ACM took it away -- which showed up as truncated boot
# output ("[PASS] freque---"), the self-test summary and register dump dropped.
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=4000

CONFIG_ORANGELINK_LOG_LEVEL=4

# UART is off entirely -- see MIGRATION_NOTES 17.3.
#
# Muting CONFIG_LOG_BACKEND_UART alone would not have saved anything: the board
# marks uart0 "okay", so with CONFIG_SERIAL=y the nrfx UARTE driver still
# initialises the peripheral at boot whether or not anything logs to it. Turning
# SERIAL off is what actually stops that, and it frees D6/D7 as a side effect.
#
# Note the devicetree console was already pointing at board_cdc_acm_uart (from the
# board's cdc_acm_serial.dtsi) while CONFIG_USB_DEVICE_STACK was never enabled, so
# UART console output had nowhere to go regardless. RTT_CONSOLE was already set.
# Turning UART_CONSOLE off directly does not work. The board sets
# BOARD_SERIAL_BACKEND_CDC_ACM=y, and that block in
# boards/common/usb/Kconfig.cdc_acm_serial.defconfig carries
# "config UART_CONSOLE default CONSOLE", which overrides an explicit n from here:
#
#   warning: UART_CONSOLE ... was assigned the value 'n' but got the value 'y'
#
# So disable the backend choice itself and the forced defaults go with it.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n

# ---------------------------------------------------------------------------
# Not configured yet, deliberately
# ---------------------------------------------------------------------------
# - CONFIG_BOOTLOADER_MCUBOOT: added with the partition layout. The board's
#   default DTS partitioning targets the Adafruit UF2 bootloader plus a 156 KB
#   SoftDevice reservation, neither of which we need -- both get overridden.
# - NUS: carries the config and factory-test protocols
#   (docs/config-storage-spec.md section 3). Phase 2.
# - A dedicated sub-GHz thread priority: Phase 3, driven by the timing analysis
#   in docs/aps-protocol-spec.md section 6, not by defaults.

# --- RFM69 module variant ----------------------------------------------------
# RFM69HC (high-power): PA0 is NOT bonded to the antenna, PA1+PA2 are. Leaving
# RegPaLevel at its PA0-only reset default -- which the legacy 916 table did,
# because the original hardware was a plain RFM69W -- radiates nothing on this
# part. This was the cause of the first 722 probe getting no reply.
CONFIG_ORANGELINK_RFM69_HW=y

# +13 dBm, the level the legacy Orangelink produced (PA0 at OutputPower 31) and
# the level this firmware has always transmitted at. Not the maximum: it is what
# the pump has always seen, and it avoids desensing its receiver at bench range.
#
# PA1+PA2, not PA1 alone -- measured, not assumed.
#
# Both reach +13 dBm on the same pin. Fitting the datasheet's +17 dBm/95 mA and
# +20 dBm/130 mA PA_BOOST points suggested PA1+PA2 carried ~60 mA of fixed bias,
# predicting 74 mA against 45 mA for one stage. That fit is invalid: +20 dBm needs
# the high-power TESTPA registers, so the two points are not on one curve.
#
# Bench measurement, multimeter in series with the battery, 201-frame wake bursts:
#
#     PA1+PA2, OutputPower 27   33 mA      PA1 only, OutputPower 31   31 mA
#
# PA1 alone is better, but by 6%, not the predicted 40% -- worth ~0.2 days out of 8
# and it forfeits all headroom above +13 dBm. Link quality identical (12/12 pump
# replies both ways). Not a good trade, so two stages stay.
#
# Reference currents from the same session: idle < 150 uA, receive 17 mA (datasheet
# RFM69 RX is 16 mA, so the method checks out). Receive is ~60% of radio energy and
# transmit ~38%, which makes RX duty cycling the lever that matters here, not the PA.
CONFIG_ORANGELINK_RFM69_HW_PA1_PA2=y
CONFIG_ORANGELINK_RFM69_TX_DBM=13

# ---------------------------------------------------------------------------
# DFU over BLE (SMP / mcumgr)
# ---------------------------------------------------------------------------
# Implements the intent recorded in MIGRATION_NOTES 2.2: the legacy buttonless
# DFU service is gone, and SMP-over-BLE replaces it. Upgrade with nRF Connect
# Device Manager.
#
# This also removes a single point of failure found the hard way -- see 14.7.
# MCUboot occupies the address the XIAO's UF2 bootloader used to boot from, so
# SWD was the ONLY way to program this board, and a flaky probe meant no way to
# flash at all.
#
# Advertising data is deliberately NOT changed. AAPS matches on it and that path
# is working; Device Manager can connect and discover the SMP service without
# the UUID being advertised. If it ever fails to list the device, add the SMP
# UUID (8D53DC1D-1DB7-4CD3-868B-8A527460AA84) to scan_rsp -- it fits there in
# 29 of 31 bytes, and leaves the primary advertising packet untouched.
# MCUMGR depends on NET_BUF and ZCBOR. Kconfig ignores an assignment whose
# dependencies are unmet *without warning*, so setting CONFIG_MCUMGR=y alone
# silently produced an image with no mcumgr in it at all -- the build succeeded
# and only `nm` on the .elf showed the SMP service was absent.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_IMG=y

# Image management needs the flash map and a streaming writer. Progressive erase
# keeps the upload from stalling on a long up-front erase of the 440 KB slot.
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# Larger mcumgr buffers: the default is sized for a 23-byte MTU and makes a
# 200 KB upload painfully slow over BLE.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
