# Orangelink -- NCS application configuration for XIAO nRF52840.
# SPDX-License-Identifier: GPL-2.0-only
#
# Values derived from the measured legacy behaviour in docs/gatt-service-spec.md.

# ---------------------------------------------------------------------------
# Bluetooth: peripheral, no pairing
# ---------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=0

# The legacy firmware requires no pairing, bonding or encryption -- every IPS and
# NUS characteristic was SEC_OPEN. Preserved for companion-app compatibility.
# This is also what makes unvalidated input remotely reachable, so every write
# callback bounds-checks len AND offset. See docs/aps-protocol-spec.md section 7.
CONFIG_BT_SMP=n

# Default name; the persisted Custom Name overrides it at runtime, so the name
# must be dynamic. 30 = legacy BLE_IPS_MAX_CUS_NAME_CHAR_LEN.
CONFIG_BT_DEVICE_NAME="OrangePro"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=30

# MTU 247 -- matches legacy NRF_SDH_BLE_GATT_MAX_MTU_SIZE, giving a 244 B ATT
# payload. The Data characteristic is separately capped at 150 by
# BLE_RESPONSE_MAX_LEN and is clamped in code, not by the stack.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# Connection parameters: 50-100 ms, latency 0, 5 s supervision timeout.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=40
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=80
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=500

# +4 dBm. On nRF52 the controller TX power is a build-time choice, unlike the
# legacy per-connection sd_ble_gap_tx_power_set().
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# 2M PHY: support it, do NOT request it. Legacy only responded to peer-initiated
# PHY updates, with PHY_AUTO. See docs/gatt-service-spec.md section 7.
# BT_USER_PHY_UPDATE only exposes the le_phy_updated callback for observability;
# Zephyr responds to peer PHY requests with or without it.
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_PHY_UPDATE=y

# Needed for the RSSI the legacy code attached to every DATA_RX event.
CONFIG_BT_CTLR_CONN_RSSI=y

# Standard Battery Service, replacing ble_bas.
CONFIG_BT_BAS=y

# ---------------------------------------------------------------------------
# Peripherals
# ---------------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_WATCHDOG=y

# ---------------------------------------------------------------------------
# Storage: FDS -> Settings/NVS
# ---------------------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
# The legacy application performs NO dynamic allocation: userKit/heap is dead
# code (zero references in app.map) and the C library heap was discarded. Keep
# it that way. See docs/legacy-flash-budget.md.
CONFIG_HEAP_MEM_POOL_SIZE=0

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ---------------------------------------------------------------------------
# Logging -- UART console on D6/D7
# ---------------------------------------------------------------------------
# The XIAO has no onboard debug probe, so RTT needs extra hardware. USB CDC ACM
# is the alternative and frees D6/D7; see the note in boards/xiao_ble.overlay.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_ORANGELINK_LOG_LEVEL=4

# RTT logging in addition to UART. The XIAO exposes no debug header, so wiring the
# UART to the probe's GP4/GP5 means two more flying leads to tiny pads. RTT rides
# the SWD link that is already connected -- read it with `pyocd rtt`. Costs ~2 KB.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=2048

# ---------------------------------------------------------------------------
# Not configured yet, deliberately
# ---------------------------------------------------------------------------
# - CONFIG_BOOTLOADER_MCUBOOT: added with the partition layout. The board's
#   default DTS partitioning targets the Adafruit UF2 bootloader plus a 156 KB
#   SoftDevice reservation, neither of which we need -- both get overridden.
# - NUS: carries the config and factory-test protocols
#   (docs/config-storage-spec.md section 3). Phase 2.
# - A dedicated sub-GHz thread priority: Phase 3, driven by the timing analysis
#   in docs/aps-protocol-spec.md section 6, not by defaults.
