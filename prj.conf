# Orangelink — NCS application configuration
#
# STATUS: UNVERIFIED. This file has never been through a build; no toolchain was
# installed in Phase 0. Kconfig symbol names and values are derived from the
# measured legacy behaviour (docs/gatt-service-spec.md) and must be validated
# against NCS v3.4.0's actual Kconfig before being trusted. Expect corrections.
#
# Values below target nRF52832. They will NOT fit nRF52810 —
# see docs/FEASIBILITY_REPORT.md §2.

# ---------------------------------------------------------------------------
# Bluetooth: peripheral, no pairing
# ---------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=0

# The legacy firmware requires no pairing, bonding or encryption: every IPS and
# NUS characteristic is SEC_OPEN. Preserved deliberately for companion-app
# compatibility. See the note in docs/FEASIBILITY_REPORT.md §B3 — this is also
# what makes the buffer overflows remotely reachable, so the port must bound-check
# every parser rather than rely on link security.
CONFIG_BT_SMP=n

# Device name comes from Settings at runtime (default "Orange" / "OrangePro"),
# and Custom Name writes change it, so the name must be dynamic.
CONFIG_BT_DEVICE_NAME="OrangePro"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=30

# MTU 247 — matches NRF_SDH_BLE_GATT_MAX_MTU_SIZE from the legacy sdk_config.h.
# Yields a 244-byte ATT payload; the Data characteristic is separately capped at
# 150 by BLE_RESPONSE_MAX_LEN and must be clamped in code.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_ATT_PREPARE_COUNT=2

# Connection parameters: 50-100 ms interval, latency 0, 5 s supervision timeout.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=40
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=80
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=500

# +4 dBm. On nRF52 the controller TX power is a build-time choice, unlike the
# legacy per-connection sd_ble_gap_tx_power_set().
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# 2M PHY: support it, but do NOT request it. The legacy firmware only responds to
# peer-initiated PHY updates, with PHY_AUTO. Actively requesting 2M would be a
# behaviour change — see docs/gatt-service-spec.md §7.
CONFIG_BT_CTLR_PHY_2M=y

# Required for the RSSI attached to every BLE_IPS_EVT_DATA_RX.
CONFIG_BT_CTLR_CONN_RSSI=y

# Standard Battery Service, replacing ble_bas.
CONFIG_BT_BAS=y

# ---------------------------------------------------------------------------
# Peripherals
# ---------------------------------------------------------------------------
CONFIG_GPIO=y

# RFM69 sub-GHz radio. Chip select stays under manual GPIO control, as in the
# legacy driver — do not hand it to the SPI peripheral.
CONFIG_SPI=y
CONFIG_SPI_NRFX=y

# Battery monitoring (SAADC AIN2 / P0.04).
CONFIG_ADC=y

# Motor (P0.30) and, on XH_5102 only, buzzer (P0.28).
CONFIG_PWM=y

# Watchdog, fed every 2000 ms in the legacy build.
CONFIG_WATCHDOG=y

# ---------------------------------------------------------------------------
# Storage: FDS -> Settings/NVS
# ---------------------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
# The legacy application performs NO dynamic allocation: userKit/heap is dead
# code (zero references in app.map) and the C library heap is discarded. Keep it
# that way. See docs/legacy-flash-budget.md.
CONFIG_HEAP_MEM_POOL_SIZE=0

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ---------------------------------------------------------------------------
# Logging over RTT (the legacy build used NRF_LOG via RTT under USER_DEBUG)
# ---------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_DEFAULT_LEVEL=3

# ---------------------------------------------------------------------------
# Bootloader / DFU
# ---------------------------------------------------------------------------
# Phase 5. Signing uses the NEW keys in keys/ — never the compromised legacy
# keys. See keys/README.md.
CONFIG_BOOTLOADER_MCUBOOT=y

# ---------------------------------------------------------------------------
# Power management
# ---------------------------------------------------------------------------
# Legacy enabled DCDC at boot (NRF_POWER->DCDCEN = 1). On current Zephyr this is
# usually expressed in the board devicetree rather than Kconfig — verify against
# NCS v3.4.0 and move to the board files if so.
CONFIG_POWER_SUPPLY_DCDC=y

# ---------------------------------------------------------------------------
# NOT configured here, deliberately
# ---------------------------------------------------------------------------
# - NUS: needed for the config + factory-test protocols (see
#   docs/config-storage-spec.md §3). Add CONFIG_BT_NUS=y or hand-roll the service
#   once the GATT layer lands in Phase 2.
# - SMP-over-BLE (CONFIG_MCUMGR + transport): Phase 5. This replaces the
#   Buttonless DFU service and is a companion-app-visible breaking change.
# - A dedicated sub-GHz thread priority: Phase 3. The timing analysis in
#   docs/aps-protocol-spec.md §6 must drive this, not defaults.
