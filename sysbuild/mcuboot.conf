# MCUboot image configuration (applied by sysbuild to the mcuboot image only).
# SPDX-License-Identifier: GPL-2.0-only

# No console and no logging in the bootloader.
#
# Required, not just an optimisation: the xiao_ble board's chosen console is the
# USB CDC ACM device from cdc_acm_serial.dtsi, and MCUboot does not enable the USB
# device stack -- so uart_console.c links against a device that was never
# instantiated ("undefined reference to __device_dts_ord_*"). Dropping the console
# resolves that and shrinks the bootloader.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

# Signing: ECDSA P-256, matching the key type generated in keys/.
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# Swap-using-move: the standard dual-slot upgrade with rollback on failure.
CONFIG_BOOT_SWAP_USING_MOVE=y

CONFIG_MULTITHREADING=y
